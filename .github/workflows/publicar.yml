name: Actualizar y publicar

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions
  schedule:                   # cada madrugada a las 3:33 hora de Madrid (GitHub va en UTC: una sirve en verano y otra en invierno)
    - cron: "33 1 * * *"      # 3:33 en horario de verano (UTC+2)
    - cron: "33 2 * * *"      # 3:33 en horario de invierno (UTC+1)
    - cron: "7,37 * * * *"    # cada media hora: solo sigue si se acaba de cerrar el acta de un partido del equipo

permissions:
  contents: write             # para el commit suelto que identifica cada despliegue (no mueve ninguna rama)
  pages: write
  id-token: write

jobs:
  hora:
    # De las dos ejecuciones de las 3:33, sigue solo la del horario vigente en Madrid; de las de cada media hora,
    # solo si el acta de un partido del equipo se ha cerrado hace poco (así el panel la tiene al poco de acabar)
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.h.outputs.seguir || steps.acta.outputs.seguir }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "$CRON" = "7,37 * * * *" ]; then
            echo "comprobar=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$desfase" = "+0200" ] && [ "$CRON" = "33 1 * * *" ]; } \
             || { [ "$desfase" = "+0100" ] && [ "$CRON" = "33 2 * * *" ]; }; then
            echo "seguir=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.h.outputs.comprobar == '1'
        uses: actions/checkout@v4
      - if: steps.h.outputs.comprobar == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.h.outputs.comprobar == '1'
        run: pip install cryptography
      - id: acta
        if: steps.h.outputs.comprobar == '1'
        env:
          JUGADORAS: "-"
          TZ: Europe/Madrid
        run: |
          if python3 actualizar.py --acta-reciente; then echo "seguir=1" >> "$GITHUB_OUTPUT"; fi

  publicar:
    needs: hora
    if: needs.hora.outputs.seguir == '1'
    runs-on: ubuntu-latest
    # Una publicación cada vez (a nivel de trabajo: las comprobaciones de media hora no hacen cola)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Descargar datos y generar informe cifrado
        env:
          INFORME_CLAVE: ${{ secrets.INFORME_CLAVE }}
          JUGADORAS: ${{ secrets.JUGADORAS }}
          TZ: Europe/Madrid
        run: |
          python3 actualizar.py
          mkdir -p web && cp informe.html web/index.html && cp directo.html web/directo.html
      - id: artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        # Lo mismo que actions/deploy-pages, pero con una versión única por ejecución: deploy-pages usa
        # el commit como versión y, tras muchos despliegues del mismo commit (directo cada 30 s),
        # GitHub Pages los da por buenos pero deja de aplicarlos
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTO: ${{ steps.artefacto.outputs.artifact_id }}
        run: |
          # La versión tiene que ser un commit del repositorio: uno suelto con el mismo contenido
          arbol=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" -q .tree.sha)
          version=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" -f message="Publicación $GITHUB_RUN_ID" \
                      -f tree="$arbol" -f "parents[]=$GITHUB_SHA" -q .sha)
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          jq -n --argjson a "$ARTEFACTO" --arg v "$version" --arg o "$oidc" \
             '{artifact_id: $a, pages_build_version: $v, oidc_token: $o}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input - > despliegue.json
          estado_url=$(jq -r .status_url despliegue.json)
          for i in $(seq 60); do
            estado=$(gh api "$estado_url" -q .status)
            echo "Despliegue $version: $estado"
            case "$estado" in
              succeed) echo "page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .html_url)" >> "$GITHUB_OUTPUT"; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) exit 1 ;;
            esac
            sleep 5
          done
          exit 1
      - name: Comprobar que la página publicada es la nueva
        # GitHub Pages puede dar el despliegue por bueno y seguir sirviendo la versión anterior
        run: |
          esperado=$(sha256sum web/index.html | cut -d' ' -f1)
          for i in $(seq 12); do
            [ "$(curl -s "${{ steps.despliegue.outputs.page_url }}?t=$(date +%s%N)" | sha256sum | cut -d' ' -f1)" = "$esperado" ] && exit 0
            sleep 10
          done
          echo "::error::GitHub Pages sigue sirviendo la versión anterior de la página"
          exit 1
