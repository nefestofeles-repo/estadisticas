name: Actualizar y publicar

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions
    inputs:
      directo:
        description: "Solo el partido en juego (lo usa directo.py)"
        type: boolean
        default: false
  schedule:                   # cada madrugada a las 3:33 hora de Madrid (GitHub va en UTC: una sirve en verano y otra en invierno)
    - cron: "33 1 * * *"      # 3:33 en horario de verano (UTC+2)
    - cron: "33 2 * * *"      # 3:33 en horario de invierno (UTC+1)

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # para lanzar "Partido en directo"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  hora:
    # De las dos ejecuciones programadas, sigue solo la que corresponde al horario vigente en Madrid
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.h.outputs.seguir }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$desfase" = "+0200" ] && [ "$CRON" = "33 1 * * *" ]; } \
             || { [ "$desfase" = "+0100" ] && [ "$CRON" = "33 2 * * *" ]; }; then
            echo "seguir=1" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: hora
    if: needs.hora.outputs.seguir == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Descargar datos y generar informe cifrado
        env:
          INFORME_CLAVE: ${{ secrets.INFORME_CLAVE }}
          JUGADORAS: ${{ secrets.JUGADORAS }}
          DIRECTO: ${{ inputs.directo }}
          TZ: Europe/Madrid
        run: |
          python3 actualizar.py
          mkdir -p web && cp informe.html web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
      - name: Comprobar que la página publicada es la nueva
        # GitHub Pages puede dar el despliegue por bueno y seguir sirviendo la versión anterior
        run: |
          esperado=$(sha256sum web/index.html | cut -d' ' -f1)
          for i in $(seq 12); do
            [ "$(curl -s "${{ steps.despliegue.outputs.page_url }}?t=$(date +%s%N)" | sha256sum | cut -d' ' -f1)" = "$esperado" ] && exit 0
            sleep 10
          done
          echo "::error::GitHub Pages sigue sirviendo la versión anterior de la página"
          exit 1
      - name: Programar la actualización en directo si hoy hay partido
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run partido.yml --repo "${{ github.repository }}"
