name: Actualizar y publicar

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions
  schedule:                   # cada madrugada a las 3:33 hora de Madrid (GitHub va en UTC: una sirve en verano y otra en invierno)
    - cron: "33 1 * * *"      # 3:33 en horario de verano (UTC+2)
    - cron: "33 2 * * *"      # 3:33 en horario de invierno (UTC+1)
    - cron: "7,37 * * * *"    # cada media hora: solo sigue si se acaba de cerrar el acta de un partido del equipo

permissions:
  contents: read

jobs:
  hora:
    # De las dos ejecuciones de las 3:33, sigue solo la del horario vigente en Madrid; de las de cada media hora,
    # solo si el acta de un partido del equipo se ha cerrado hace poco (así el panel la tiene al poco de acabar)
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.h.outputs.seguir || steps.acta.outputs.seguir }}
    steps:
      - id: h
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ "$CRON" = "7,37 * * * *" ]; then
            echo "comprobar=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "$desfase" = "+0200" ] && [ "$CRON" = "33 1 * * *" ]; } \
             || { [ "$desfase" = "+0100" ] && [ "$CRON" = "33 2 * * *" ]; }; then
            echo "seguir=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.h.outputs.comprobar == '1'
        uses: actions/checkout@v4
      - if: steps.h.outputs.comprobar == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.h.outputs.comprobar == '1'
        run: pip install cryptography
      - id: acta
        if: steps.h.outputs.comprobar == '1'
        env:
          JUGADORAS: "-"
          TZ: Europe/Madrid
        run: |
          if python3 actualizar.py --acta-reciente; then echo "seguir=1" >> "$GITHUB_OUTPUT"; fi

  publicar:
    needs: hora
    if: needs.hora.outputs.seguir == '1'
    runs-on: ubuntu-latest
    # Una publicación cada vez (a nivel de trabajo: las comprobaciones de media hora no hacen cola)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: https://estadisticas-baloncesto.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pillow
      - name: Descargar datos y generar informe cifrado
        env:
          INFORME_CLAVE: ${{ secrets.INFORME_CLAVE }}
          JUGADORAS: ${{ secrets.JUGADORAS }}
          AUTORIZADOS: ${{ secrets.AUTORIZADOS }}           # correos que pueden entrar con Google
          ADMINISTRADORES: ${{ secrets.ADMINISTRADORES }}   # pueden borrar cualquier mensaje o foto
          INVITACIONES: ${{ secrets.INVITACIONES }}         # enlaces de invitación ("nombre = código" por línea)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          TZ: Europe/Madrid
        run: |
          python3 actualizar.py
          mkdir -p web && cp informe.html web/index.html && cp directo.html web/directo.html && cp social.js escudo.png web/
      - name: Base de datos de mensajes y almacén de fotos (se crean la primera vez)
        # Si falla (p. ej. el token de Cloudflare no tiene permiso para D1 y KV), la web se publica igual, sin mensajes
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          api() { local ruta=$1; shift; curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$ruta"; }
          d1=$(api "d1/database?name=estadisticas-social" | jq -r '.result[] | select(.name == "estadisticas-social") | .uuid')
          [ -n "$d1" ] || d1=$(api d1/database -X POST -d '{"name": "estadisticas-social"}' | jq -r .result.uuid)
          kv=$(api "storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title == "estadisticas-fotos") | .id')
          [ -n "$kv" ] || kv=$(api storage/kv/namespaces -X POST -d '{"title": "estadisticas-fotos"}' | jq -r .result.id)
          cat > social.toml <<EOF
          name = "estadisticas-baloncesto"
          pages_build_output_dir = "web"
          compatibility_date = "2025-01-01"
          [[d1_databases]]
          binding = "DB"
          database_name = "estadisticas-social"
          database_id = "$d1"
          [[kv_namespaces]]
          binding = "FOTOS"
          id = "$kv"
          EOF
          npx --yes wrangler@3 d1 execute estadisticas-social --remote --file=social/esquema.sql -c social.toml
          mv social.toml wrangler.toml   # con él, la publicación conecta la base de datos y las fotos a la web
      - name: Publicar en Cloudflare Pages (con inicio de sesión de Google, functions/_middleware.js)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy web --project-name=estadisticas-baloncesto --branch=main --commit-dirty=true
      - name: Comprobar que la web sigue cerrada sin iniciar sesión
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://estadisticas-baloncesto.pages.dev/?t=$(date +%s)")
          [ "$codigo" = 401 ] || { echo "::error::La web responde $codigo sin iniciar sesión (se esperaba 401)"; exit 1; }
