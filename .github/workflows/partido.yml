name: Partido en directo

# Lo lanza cada madrugada "Actualizar y publicar". Si hoy hay partido, espera a que empiece
# y durante 1 h 40 min lanza la publicación cada 30 segundos (ver directo.py).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write              # para lanzar publicar.yml y volver a lanzarse a sí mismo

concurrency:
  group: partido
  cancel-in-progress: true

jobs:
  directo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Esperar al partido y actualizar durante el juego
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Madrid
        run: python3 directo.py
